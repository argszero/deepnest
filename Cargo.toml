[workspace]
resolver = "2"
members = [
    "crates/llm",
    "crates/sandbox",
    "crates/command_scan",
    "crates/tools",
    "crates/agent",
    "crates/apps",
    "crates/skills",
    "crates/gateway",
    "crates/web",
    "crates/deepnest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/argszero/deepnest"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
