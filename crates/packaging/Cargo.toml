[package]
name = "deepnest-packaging"
description = "The toolchain deepnest carries: where an unpacked one lives, what makes it whole, and what an interrupted unpack leaves behind"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# What a payload is: a tar inside a zstd stream. `tar` writes and reads the container, `zstd` the
# compression, and both are the shape rustup distributes a toolchain in.
tar = "0.4"
zstd = "0.13"

# The writer `pack` was built against, reachable from a release. Named `deepnest-pack` rather than
# taking the crate's own name, because the thing a pipeline calls should say what it does: this
# program packs, and `deepnest-bundle` is the one that lays out a `.app`.
[[bin]]
name = "deepnest-pack"
path = "src/main.rs"
