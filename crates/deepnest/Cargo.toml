[package]
name = "deepnest"
description = "The deepnest binary: the config it reads, the control token it writes, single-instance admission and the one listening port"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "deepnest"
path = "src/main.rs"

[dependencies]
deepnest-apps = { path = "../apps" }
getrandom = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
socket2 = "0.5"
toml = "0.8"
