[package]
name = "deepnest-bundle"
description = "The macOS app bundle deepnest ships in: the two files a bundle is made of, the Info.plist that makes the system launch one, which files inside a tree a signature has to cover, and what makes this refuse to write a bundle that opens and does nothing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "deepnest_bundle"
path = "src/lib.rs"

[[bin]]
name = "deepnest-bundle"
path = "src/main.rs"
